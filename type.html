.nav-btns { display: flex; justify-content: space-between; margin-top: 2rem; align-items: center; }

.btn-next {

.intro { text-align: center; padding: 2rem 0 2rem; }
.intro-mark { font-family: 'Nunito Sans', sans-serif; font-size: 13px; font-weight: 900; letter-spacing: 0.35em; color: #0fb8a0; margin-bottom: 2rem; }
.intro-accent { width: 40px; height: 3px; background: #0fb8a0; border-radius: 2px; margin: 0 auto 1.75rem; }

.hero-tagline { font-size: 14px; font-weight: 500; opacity: 0.75; margin-bottom: 1.25rem; padding-bottom: 1.25rem; border-bottom: 1px solid rgba(0,0,0,0.1); }

.stm-avatar.c3 { background: linear-gradient(135deg, rgba(196,88,26,0.6), rgba(166,63,91,0.65)); }
.stm-avatar.c4 { background: linear-gradient(135deg, rgba(63,140,26,0.6), rgba(15,184,160,0.55)); }

.matches { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1.75rem; }

.type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.type-chip {

.detail-emoji { font-size: 28px; margin-bottom: 0.5rem; }

.detail-tagline { font-size: 12px; opacity: 0.65; margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid rgba(0,0,0,0.1); }
.detail-body { font-size: 13px; line-height: 1.85; opacity: 0.88; white-space: pre-line; margin-bottom: 0.75rem; }
.detail-cta { font-size: 13px; font-weight: 700; }

.common-note {

.divider { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 1.5rem 0; }
.footer-note { font-size: 13px; color: rgba(255,255,255,0.35); text-align: center; line-height: 1.8; margin-bottom: 1.5rem; }
.restart-btn {
  display: block; width: 100%; padding: 12px;
  border: 1px solid rgba(255,255,255,0.2); background: transparent;
  color: rgba(255,255,255,0.5); border-radius: 8px; font-size: 14px;
  font-family: 'Noto Sans JP', sans-serif; cursor: pointer; text-align: center; transition: background 0.15s;
}
.restart-btn:hover { background: rgba(255,255,255,0.06); }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.animate { animation: fadeUp 0.5s ease; }
</style>

var answers = new Array(QUIZ_DATA.length).fill(null);
var currentQ = 0;
var openType = null;
var COLORS = ['c1','c2','c3','c4','c5','c6','c7','c8'];

function showScreen(name) {
  ['intro','quiz','result'].forEach(function(s) {
    document.getElementById('screen-' + s).style.display = s === name ? '' : 'none';
  });
  window.scrollTo(0, 0);
}

// --- Intro ---
document.getElementById('start-btn').addEventListener('click', function() {
  answers = new Array(QUIZ_DATA.length).fill(null);
  currentQ = 0;
  showQuiz(0);
  showScreen('quiz');
});

// --- Quiz ---
function showQuiz(n) {
  var q = QUIZ_DATA[n];
  var isLast = n === QUIZ_DATA.length - 1;
  var pct = Math.round(((n + 1) / QUIZ_DATA.length) * 100);

  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('q-num').textContent = 'Q ' + (n + 1) + ' / ' + QUIZ_DATA.length;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('btn-next').textContent = isLast ? '結果を見る →' : '次へ →';
  document.getElementById('btn-next').disabled = answers[n] === null;

  var opts = document.getElementById('options');
  opts.innerHTML = q.opts.map(function(o) {
    var sel = answers[n] === o.type;
    return '<button class="opt' + (sel ? ' selected' : '') + '" data-type="' + o.type + '">' + o.text + '</button>';
  }).join('');
  opts.querySelectorAll('.opt').forEach(function(btn) {
    btn.addEventListener('click', function() {
      answers[n] = btn.dataset.type;
      opts.querySelectorAll('.opt').forEach(function(b) { b.classList.toggle('selected', b === btn); });
      document.getElementById('btn-next').disabled = false;
    });
  });
}

document.getElementById('btn-back').addEventListener('click', function() {
  if (currentQ === 0) {
    showScreen('intro');
  } else {
    currentQ--;
    showQuiz(currentQ);
  }
});

document.getElementById('btn-next').addEventListener('click', function() {
  if (answers[currentQ] === null) return;
  if (currentQ < QUIZ_DATA.length - 1) {
    currentQ++;
    showQuiz(currentQ);
  } else {
    var type = calcResult();
    buildResult(type);
    showScreen('result');
    loadSameTypeMembers(type);
  }
});

// --- Scoring ---
function calcResult() {
  var scores = {};
  answers.forEach(function(t) { scores[t] = (scores[t] || 0) + 1; });
  return Object.keys(scores).reduce(function(a, b) { return scores[a] >= scores[b] ? a : b; });
}

// --- Result ---
function buildResult(typeKey) {
  var t = TYPES_DATA[typeKey];
  openType = null;

  var hero = document.getElementById('result-hero');
  hero.style.background = t.bg;
  hero.innerHTML =
    '<div class="hero-emoji">' + t.emoji + '</div>'
    + '<div class="hero-label" style="color:' + t.text + ';">あなたのタイプ</div>'
    + '<div class="hero-type" style="color:' + t.text + ';">' + t.name + '</div>'
    + '<div class="hero-en" style="color:' + t.text + ';">' + t.en.toUpperCase() + '</div>'
    + '<div class="hero-tagline" style="color:' + t.text + ';">' + t.tagline + '</div>'
    + '<div class="hero-body" style="color:' + t.text + ';">' + t.body + '</div>'
    + '<div class="hero-cta" style="color:' + t.color + ';">' + t.cta + '</div>';

  document.getElementById('result-matches').innerHTML = t.matches.map(function(mk, i) {
    var m = TYPES_DATA[mk];
    return '<div class="match">'
      + '<div class="match-name" style="color:' + m.color + ';">' + m.emoji + ' ' + m.name + '</div>'
      + '<div class="match-why">' + t.matchReasons[i] + '</div>'
      + '</div>';
  }).join('');

  var typeKeys = Object.keys(TYPES_DATA);
  document.getElementById('type-grid').innerHTML = typeKeys.map(function(k) {
    var m = TYPES_DATA[k];
    var isMe = k === typeKey;
    return '<button class="type-chip' + (isMe ? ' is-me' : '') + '"'
      + (isMe ? ' style="border-color:' + m.color + ';background:' + m.bg + ';"' : '')
      + ' onclick="toggleDetail(\'' + k + '\')">'
      + '<span class="chip-emoji">' + m.emoji + '</span>'
      + '<div class="chip-texts">'
      + '<div class="chip-name"' + (isMe ? ' style="color:' + m.text + ';"' : '') + '>' + m.name + '</div>'
      + (isMe ? '<div class="chip-you" style="color:' + m.color + ';">← あなた</div>' : '')
      + '</div>'
      + '<span class="chip-arrow" id="arr-' + k + '">▼</span>'
      + '</button>';
  }).join('');
  document.getElementById('type-detail-area').innerHTML = '';
  document.getElementById('same-type-section').style.display = 'none';
}

function toggleDetail(key) {
  openType = (openType === key) ? null : key;
  var area = document.getElementById('type-detail-area');
  document.querySelectorAll('.chip-arrow').forEach(function(el) { el.classList.remove('open'); });
  if (openType) {
    var t = TYPES_DATA[openType];
    document.getElementById('arr-' + openType).classList.add('open');
    area.innerHTML = '<div class="type-detail-panel" style="background:' + t.bg + ';">'
      + '<div class="detail-emoji">' + t.emoji + '</div>'
      + '<div class="detail-type" style="color:' + t.text + ';">' + t.name + '</div>'
      + '<div class="detail-tagline" style="color:' + t.text + ';">' + t.tagline + '</div>'
      + '<div class="detail-body" style="color:' + t.text + ';">' + t.body + '</div>'
      + '<div class="detail-cta" style="color:' + t.color + ';">' + t.cta + '</div>'
      + '</div>';
    area.querySelector('.type-detail-panel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  } else {
    area.innerHTML = '';
  }
}

// --- Same type members (live from GAS) ---
async function loadSameTypeMembers(typeKey) {
  try {
    var res = await gasGet({ action: 'participants' });
    if (!res.ok || !res.data) return;
    var members = res.data
      .filter(function(m) { return m.enjin_type === typeKey && (m.nickname || m.name); })
      .map(function(m, i) {
        return { nickname: m.nickname || m.name, edit_id: m.edit_id, photo_url: m.photo_url, color: COLORS[i % COLORS.length] };
      });
    if (members.length === 0) return;
    var container = document.getElementById('same-type-members');
    container.innerHTML = members.map(function(m) {
      var initial = m.nickname.charAt(0);
      var avatar = m.photo_url
        ? '<img src="' + convertDriveUrl(m.photo_url) + '" alt="' + m.nickname + '">'
        : initial;
      return '<a class="stm-item" href="profile.html?id=' + m.edit_id + '">'
        + '<div class="stm-avatar ' + m.color + '">' + avatar + '</div>'
        + '<div class="stm-name">' + m.nickname + '</div>'
        + '</a>';
    }).join('');
    document.getElementById('same-type-section').style.display = '';
  } catch (e) {}
}

document.getElementById('restart-btn').addEventListener('click', function() {
  showScreen('intro');
});
