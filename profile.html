<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ENJIN 2026 GUIDE BOOK</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@700;800;900&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP', sans-serif; background: #eef1f8; min-height: 100vh; }

.nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(255,255,255,0.95); backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 28px; border-bottom: 1px solid rgba(13,26,107,0.08);
}
.nav-logo { font-family: 'Nunito Sans', sans-serif; font-size: 15px; font-weight: 900; letter-spacing: 0.15em; color: #0d1a6b; text-decoration: none; }
.nav-logo span { color: #0fb8a0; }
.nav-back { font-size: 11px; color: #888; text-decoration: none; display: flex; align-items: center; gap: 5px; transition: color 0.15s; }
.nav-back:hover { color: #0d1a6b; }

.page { max-width: 520px; margin: 0 auto; padding: 32px 20px 80px; }

.pb {
  background: #fff; border-radius: 10px; overflow: visible;
  border: 1px solid rgba(13,26,107,0.1); position: relative;
  box-shadow: 0 4px 24px rgba(13,26,107,0.1), 0 1px 4px rgba(13,26,107,0.06);
}
.pb-holes {
  position: absolute; left: 0; top: 0; bottom: 0; width: 28px;
  background: #fff; border-right: 1px solid rgba(13,26,107,0.07);
  border-radius: 10px 0 0 10px;
  display: flex; flex-direction: column; align-items: center;
  justify-content: space-evenly; padding: 20px 0; z-index: 1;
}
.pb-hole {
  width: 12px; height: 12px; border-radius: 50%;
  background: #eef1f8; border: 1px solid rgba(13,26,107,0.12);
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.07);
}
.pb-inner { margin-left: 28px; border-radius: 0 10px 10px 0; overflow: hidden; }

/* ヘッダー */
.pb-header {
  background: #0d1a6b; border-bottom: 3px solid #0fb8a0;
  padding: 20px 20px; display: flex; align-items: center; gap: 16px;
  min-height: 120px; position: relative;
}
.pb-avatar {
  width: 90px; height: 90px; border-radius: 18px; flex-shrink: 0;
  background: linear-gradient(135deg, #5b3fa6, #1a6fc4);
  display: flex; align-items: center; justify-content: center;
  font-size: 36px; font-weight: 700; color: rgba(255,255,255,0.8);
  border: 3px solid rgba(255,255,255,0.9); overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,0.35); font-family: 'Noto Sans JP', sans-serif;
  position: relative; z-index: 2;
}
.pb-avatar img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.pb-header-text { flex: 1; min-width: 0; }
.pb-nickname { font-family: 'Noto Sans JP', sans-serif; font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 5px; line-height: 1.2; }
.pb-realname { font-size: 11px; color: rgba(255,255,255,0.6); margin-bottom: 3px; letter-spacing: 0.06em; }
.pb-org { font-size: 11px; color: rgba(255,255,255,0.45); line-height: 1.6; }
.pb-fb-icon {
  width: 40px; height: 40px; flex-shrink: 0;
  align-self: flex-end; display: block;
  text-decoration: none; opacity: 0.9; transition: opacity 0.15s;
}
.pb-fb-icon:hover { opacity: 1; }
.pb-fb-icon svg { width: 40px; height: 40px; display: block; }

/* セクション共通 */
.pb-section { padding: 18px 20px; border-bottom: 1px solid rgba(13,26,107,0.07); }
.pb-section:last-child { border-bottom: none; }
.pb-section-title {
  font-size: 8px; letter-spacing: 0.3em; color: #0fb8a0;
  font-family: 'Nunito Sans', sans-serif; font-weight: 700;
  margin-bottom: 13px; display: flex; align-items: center; gap: 8px;
}
.pb-section-title::after { content: ''; flex: 1; height: 1px; background: rgba(15,184,160,0.25); }

/* BASIC INFO */
.pb-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pb-field { background: #f5f7fc; border-radius: 8px; padding: 9px 12px; border: 1px solid rgba(13,26,107,0.07); }
.pb-field-full { background: #f5f7fc; border-radius: 8px; padding: 9px 12px; margin-top: 8px; border: 1px solid rgba(13,26,107,0.07); }
.pb-field-label { font-size: 8px; color: #999; letter-spacing: 0.15em; margin-bottom: 4px; font-family: 'Nunito Sans', sans-serif; }
.pb-field-val { font-size: 13px; color: #1a2a6b; line-height: 1.5; font-weight: 500; }

/* 権限区切りライン */
.permission-divider {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 7px 20px; background: rgba(15,184,160,0.06);
  border-top: 1px solid rgba(15,184,160,0.18);
  border-bottom: 1px solid rgba(15,184,160,0.18);
}
.permission-divider-text {
  font-size: 9px; color: #0fb8a0; letter-spacing: 0.12em;
  font-family: 'Nunito Sans', sans-serif; font-weight: 700;
}

/* セクションヘッダー（タイトル＋編集ボタン横並び） */
.type-section-header, .message-section-header { display: flex; align-items: center; gap: 8px; margin-bottom: 13px; }
.type-section-header .pb-section-title, .message-section-header .pb-section-title { flex: 1; margin-bottom: 0; }

/* MESSAGE */
.pb-message {
  background: #f5f7fc; border: 1px solid rgba(13,26,107,0.07);
  border-radius: 8px; padding: 14px 16px;
  font-size: 14px; color: #1a2a6b; line-height: 1.8;
}

/* ENJIN TYPE */
.type-block {
  background: #f5f7fc; border: 1px solid rgba(13,26,107,0.07);
  border-radius: 8px; padding: 10px 13px;
  display: flex; align-items: center; gap: 10px;
}
.type-emoji { font-size: 22px; flex-shrink: 0; }
.type-label { font-size: 8px; color: #999; letter-spacing: 0.15em; margin-bottom: 3px; font-family: 'Nunito Sans', sans-serif; }
.type-name { font-size: 14px; font-weight: 700; color: #0d1a6b; }
.type-select {
  width: 100%; border: 1px solid rgba(13,26,107,0.15); border-radius: 6px;
  padding: 8px 10px; font-size: 13px; color: #1a2a6b;
  font-family: 'Noto Sans JP', sans-serif; background: #fff; margin-top: 6px;
}
.type-cta {
  display: flex; align-items: center; gap: 13px;
  border: 1.5px dashed rgba(15,184,160,0.5); border-radius: 8px;
  padding: 12px 14px; background: rgba(15,184,160,0.04);
  text-decoration: none; transition: background 0.15s;
}
.type-cta:hover { background: rgba(15,184,160,0.09); }
.type-cta-icon { font-size: 22px; opacity: 0.4; flex-shrink: 0; }
.type-cta-main { font-size: 12px; font-weight: 700; color: #0fb8a0; }
.type-cta-sub { font-size: 9px; color: #aaa; margin-top: 3px; line-height: 1.5; }

/* GIVE & NEED */
.pb-give-item { margin-bottom: 8px; }
.pb-give-item:last-child { margin-bottom: 0; }
.give-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.give-label { font-size: 8px; color: #999; letter-spacing: 0.15em; font-family: 'Nunito Sans', sans-serif; }
.give-edit-btn {
  background: none; border: none; cursor: pointer;
  font-size: 11px; color: #0fb8a0; padding: 2px 0; letter-spacing: 0.06em;
}
.give-val {
  background: #f5f7fc; border-radius: 8px; padding: 10px 12px;
  font-size: 13px; color: #1a2a6b; line-height: 1.6; font-weight: 500;
  border: 1px solid rgba(13,26,107,0.07);
}
.give-add-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 10px 14px; width: 100%;
  border: 1.5px dashed rgba(15,184,160,0.5); border-radius: 8px;
  background: rgba(15,184,160,0.04); color: #0fb8a0;
  font-size: 13px; font-weight: 700; cursor: pointer;
  font-family: 'Noto Sans JP', sans-serif; text-align: left;
}
.give-textarea {
  width: 100%; min-height: 80px;
  background: #fff; border: 1.5px solid #0fb8a0; border-radius: 8px;
  padding: 10px 12px; font-size: 13px; color: #1a2a6b;
  font-family: 'Noto Sans JP', sans-serif; resize: vertical; line-height: 1.7;
}
.give-actions { display: flex; gap: 8px; margin-top: 8px; }
.give-save-btn {
  background: #0d1a6b; color: #fff; border: none; border-radius: 8px;
  padding: 9px 18px; font-size: 13px; font-weight: 700; cursor: pointer;
  font-family: 'Noto Sans JP', sans-serif;
}
.give-cancel-btn {
  background: none; border: 1px solid rgba(13,26,107,0.15); border-radius: 8px;
  padding: 9px 14px; font-size: 13px; color: #888; cursor: pointer;
  font-family: 'Noto Sans JP', sans-serif;
}

/* STAMP TAG（コメントに付くラベル） */
.stamp-tag {
  display: inline-flex; align-items: center; gap: 4px;
  background: #0fb8a0; border: none;
  border-radius: 20px; padding: 3px 10px; margin-bottom: 6px;
  font-size: 11px; color: #fff; font-weight: 700; letter-spacing: 0.03em;
}

/* STAMP SELECT（投稿フォームのプルダウン） */
.stamp-select {
  width: 100%; border: 1px solid rgba(13,26,107,0.15); border-radius: 6px;
  padding: 8px 10px; font-size: 13px; color: #1a2a6b;
  font-family: 'Noto Sans JP', sans-serif; background: #fff; margin-bottom: 8px;
}
.stamp-select:focus { outline: none; border-color: #0fb8a0; }

/* COMMENTS */
.comment-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.comment-item { background: #fff; border-radius: 8px; padding: 10px 12px; border: 1px solid rgba(13,26,107,0.1); }
.comment-meta { font-size: 10px; margin-bottom: 5px; display: flex; align-items: center; gap: 6px; }
.comment-name { font-weight: 700; color: #0d1a6b; }
.comment-date { color: #bbb; }
.comment-text { font-size: 13px; color: #1a2a6b; line-height: 1.7; white-space: pre-wrap; }
.comment-form { padding-top: 14px; border-top: 1px solid rgba(13,26,107,0.07); }
.comment-input {
  width: 100%; border: 1px solid rgba(13,26,107,0.15); border-radius: 6px;
  padding: 8px 10px; font-size: 13px; color: #1a2a6b;
  font-family: 'Noto Sans JP', sans-serif; background: #fff; margin-bottom: 8px;
}
.comment-input:focus, .comment-textarea:focus { outline: none; border-color: #0fb8a0; }
.comment-textarea {
  width: 100%; min-height: 70px;
  background: #fff; border: 1px solid rgba(13,26,107,0.15); border-radius: 8px;
  padding: 10px 12px; font-size: 13px; color: #1a2a6b;
  font-family: 'Noto Sans JP', sans-serif; resize: vertical; line-height: 1.7;
}
.comment-submit-btn {
  background: #0d1a6b; color: #fff; border: none; border-radius: 8px;
  padding: 9px 18px; font-size: 13px; font-weight: 700; cursor: pointer;
  font-family: 'Noto Sans JP', sans-serif; margin-top: 8px;
}
.comment-submit-btn:disabled { background: #aaa; cursor: not-allowed; }
.comment-empty { font-size: 13px; color: #bbb; margin-bottom: 14px; }
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="home.html">ENJIN 2026 <span>GUIDE BOOK</span></a>
  <a class="nav-back" href="members.html">← 一覧に戻る</a>
</nav>

<div class="page">
  <div class="pb">
    <div class="pb-holes">
      <div class="pb-hole"></div><div class="pb-hole"></div>
      <div class="pb-hole"></div><div class="pb-hole"></div>
      <div class="pb-hole"></div><div class="pb-hole"></div>
      <div class="pb-hole"></div>
    </div>
    <div class="pb-inner">

      <!-- ヘッダー -->
      <div class="pb-header">
        <div class="pb-avatar" id="avatar"></div>
        <div class="pb-header-text">
          <div class="pb-nickname" id="nickname">読み込み中...</div>
          <div class="pb-realname" id="realname"></div>
          <div class="pb-org" id="org"></div>
        </div>
        <a class="pb-fb-icon" id="fb-icon" href="#" target="_blank"
           title="Facebookプロフィールを見る" style="display:none">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
            <circle cx="20" cy="20" r="20" fill="#1877F2"/>
            <path fill="#fff" d="M21.5 21h3l.6-4h-3.6v-2.2c0-1.1.3-1.8 1.8-1.8H25V9.3C24.5 9.2 23 9 21.4 9 18 9 15.8 11 15.8 14.8V17H12.5v4h3.3V31h4.7V21z"/>
          </svg>
        </a>
      </div>

      <!-- BASIC INFO（運営管理） -->
      <div class="pb-section">
        <div class="pb-section-title">BASIC INFO</div>
        <div class="pb-grid2">
          <div class="pb-field">
            <div class="pb-field-label">出身地</div>
            <div class="pb-field-val" id="hometown">—</div>
          </div>
          <div class="pb-field">
            <div class="pb-field-label">参加回数</div>
            <div class="pb-field-val" id="enjin-count">—</div>
          </div>
        </div>
        <div class="pb-field-full">
          <div class="pb-field-label">参加予定のイニシアチブ</div>
          <div class="pb-field-val" id="initiative">—</div>
        </div>
      </div>

      <!-- 権限区切りライン（認証済みのみ表示） -->
      <div class="permission-divider" id="permission-divider" style="display:none">
        <span class="permission-divider-text">↓ ここから下はいつでも編集できます</span>
      </div>

      <!-- MESSAGE -->
      <div class="pb-section">
        <div class="message-section-header">
          <div class="pb-section-title">MESSAGE</div>
          <button class="give-edit-btn" id="message-edit-btn" style="display:none">編集</button>
        </div>
        <div id="message-area"></div>
      </div>

      <!-- ENJIN TYPE -->
      <div class="pb-section">
        <div class="type-section-header">
          <div class="pb-section-title">ENJIN TYPE</div>
          <button class="give-edit-btn" id="type-edit-btn-outer" style="display:none">編集</button>
        </div>
        <div id="type-area"></div>
      </div>

      <!-- GIVE & NEED -->
      <div class="pb-section">
        <div class="pb-section-title">GIVE & NEED</div>
        <div id="give-area"></div>
      </div>

      <!-- COMMENTS -->
      <div class="pb-section">
        <div class="pb-section-title">COMMENTS</div>
        <div id="comments-area">
          <div class="comment-empty">読み込み中...</div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="guidebook.js"></script>
<script>
requireAuth();

const state = { message: '', enjinType: '', canGive: '', needHelp: '' };
let currentEditId = null;

const TYPE_OPTIONS = Object.entries(ENJIN_TYPES)
  .map(([k, v]) => `<option value="${k}">${v.emoji} ${v.name}</option>`)
  .join('');

// ---- MESSAGE ----

function renderMessage(isOwn) {
  const area = document.getElementById('message-area');
  const editBtn = document.getElementById('message-edit-btn');
  if (editBtn) {
    editBtn.style.display = isOwn ? '' : 'none';
    editBtn.onclick = () => openMessageEdit();
  }
  if (state.message) {
    area.innerHTML = `<div class="pb-message">${state.message}</div>`;
  } else if (isOwn) {
    area.innerHTML = `<button class="give-add-btn" id="msg-add-btn">＋ 追加する</button>`;
    area.querySelector('#msg-add-btn').addEventListener('click', () => openMessageEdit());
  } else {
    area.innerHTML = '';
  }
}

function openMessageEdit() {
  const area = document.getElementById('message-area');
  const editBtn = document.getElementById('message-edit-btn');
  if (editBtn) editBtn.style.display = 'none';
  area.innerHTML = `
    <textarea class="give-textarea" placeholder="今年のENJINに向けて、メッセージを書いてください" style="min-height:100px;">${state.message || ''}</textarea>
    <div class="give-actions">
      <button class="give-save-btn" id="msg-save-btn">保存する</button>
      <button class="give-cancel-btn" id="msg-cancel-btn">キャンセル</button>
    </div>`;
  area.querySelector('#msg-save-btn').addEventListener('click', async () => {
    const val = area.querySelector('textarea').value.trim();
    state.message = val;
    renderMessage(true);
    await saveProfile({ message: val });
  });
  area.querySelector('#msg-cancel-btn').addEventListener('click', () => renderMessage(true));
  area.querySelector('textarea').focus();
}

// ---- ENJIN TYPE ----

function renderType(isOwn, isDiagnosed) {
  const typeArea = document.getElementById('type-area');
  const outerBtn = document.getElementById('type-edit-btn-outer');
  if (outerBtn) outerBtn.style.display = 'none';

  if (!isOwn) {
    if (isDiagnosed && state.enjinType && ENJIN_TYPES[state.enjinType]) {
      const t = ENJIN_TYPES[state.enjinType];
      typeArea.innerHTML = `
        <div class="type-block">
          <div class="type-emoji">${t.emoji}</div>
          <div style="flex:1;min-width:0;">
            <div class="type-label">ENJIN TYPE</div>
            <div class="type-name">${t.name}</div>
          </div>
        </div>`;
    } else {
      typeArea.innerHTML = '';
    }
    return;
  }

  if (!isDiagnosed) {
    typeArea.innerHTML = `
      <a class="type-cta" href="https://enjin-camp.github.io/type/" target="_blank">
        <div class="type-cta-icon">🔍</div>
        <div>
          <div class="type-cta-main">→ 簡単6問！今すぐ診断する</div>
          <div class="type-cta-sub">あなたの役割タイプと、出会うべき仲間が見えてきます</div>
        </div>
      </a>
      <div style="margin-top:8px;">
        <div class="pb-field-label">すでに診断済みの方はこちらから入力</div>
        <select class="type-select" id="type-select">
          <option value="">-- タイプを選択 --</option>
          ${TYPE_OPTIONS}
        </select>
        <div class="give-actions" style="margin-top:8px;">
          <button class="give-save-btn" id="type-save-btn">保存する</button>
        </div>
      </div>`;
    typeArea.querySelector('#type-save-btn').addEventListener('click', async () => {
      const val = typeArea.querySelector('#type-select').value;
      state.enjinType = val;
      renderType(true, !!val);
      await saveProfile({ enjin_type: val });
    });
    return;
  }

  if (state.enjinType && ENJIN_TYPES[state.enjinType]) {
    const t = ENJIN_TYPES[state.enjinType];
    if (outerBtn) {
      outerBtn.style.display = '';
      outerBtn.onclick = () => openTypeEdit();
    }
    typeArea.innerHTML = `
      <div class="type-block">
        <div class="type-emoji">${t.emoji}</div>
        <div style="flex:1;min-width:0;">
          <div class="type-label">ENJIN TYPE</div>
          <div class="type-name">${t.name}</div>
        </div>
        <a href="https://enjin-camp.github.io/type/" target="_blank"
           style="font-size:10px;color:#0fb8a0;text-decoration:none;white-space:nowrap;flex-shrink:0;">→ もう一度診断する</a>
      </div>`;
  } else {
    openTypeEdit();
  }
}

function openTypeEdit() {
  const typeArea = document.getElementById('type-area');
  const outerBtn = document.getElementById('type-edit-btn-outer');
  if (outerBtn) outerBtn.style.display = 'none';
  typeArea.innerHTML = `
    <div>
      <div class="pb-field-label">ENJIN TYPE</div>
      <select class="type-select" id="type-select">
        <option value="">-- タイプを選択 --</option>
        ${TYPE_OPTIONS}
      </select>
      <div class="give-actions" style="margin-top:8px;">
        <button class="give-save-btn" id="type-save-btn">保存する</button>
        <button class="give-cancel-btn" id="type-cancel-btn">キャンセル</button>
      </div>
    </div>`;
  typeArea.querySelector('#type-select').value = state.enjinType || '';
  typeArea.querySelector('#type-save-btn').addEventListener('click', async () => {
    const val = typeArea.querySelector('#type-select').value;
    state.enjinType = val;
    renderType(true, !!val);
    await saveProfile({ enjin_type: val });
  });
  typeArea.querySelector('#type-cancel-btn').addEventListener('click', () => {
    renderType(true, !!state.enjinType);
  });
}

// ---- GIVE & NEED ----

function renderGive(isOwn) {
  const giveArea = document.getElementById('give-area');
  giveArea.innerHTML = renderGiveItem('canGive', 'ギブできること', isOwn)
                     + renderGiveItem('needHelp', '助けてほしいこと', isOwn);
  giveArea.querySelectorAll('.give-edit-btn, .give-add-btn').forEach(btn => {
    btn.addEventListener('click', () => openGiveEdit(btn.dataset.field));
  });
}

function renderGiveItem(field, label, isOwn) {
  const val = state[field];
  if (isOwn) {
    return `<div class="pb-give-item">
      <div class="give-header">
        <div class="give-label">${label}</div>
        ${val ? `<button class="give-edit-btn" data-field="${field}">編集</button>` : ''}
      </div>
      ${val
        ? `<div class="give-val">${val}</div>`
        : `<button class="give-add-btn" data-field="${field}">＋ 追加する</button>`}
    </div>`;
  }
  return `<div class="pb-give-item">
    <div class="give-header"><div class="give-label">${label}</div></div>
    <div class="give-val" style="${val ? '' : 'color:#bbb;'}">${val || '—'}</div>
  </div>`;
}

function openGiveEdit(field) {
  const giveArea = document.getElementById('give-area');
  const item = giveArea.querySelector(`[data-field="${field}"]`)?.closest('.pb-give-item');
  if (!item) return;
  const label = field === 'canGive' ? 'ギブできること' : '助けてほしいこと';
  const prev = state[field] || '';
  item.innerHTML = `
    <div class="give-label" style="margin-bottom:6px;">${label}</div>
    <textarea class="give-textarea" placeholder="自由に書いてください">${prev}</textarea>
    <div class="give-actions">
      <button class="give-save-btn">保存する</button>
      <button class="give-cancel-btn">キャンセル</button>
    </div>`;
  item.querySelector('.give-save-btn').addEventListener('click', async () => {
    const val = item.querySelector('.give-textarea').value.trim();
    state[field] = val;
    renderGive(true);
    const gasField = field === 'canGive' ? 'can_give' : 'need_help';
    await saveProfile({ [gasField]: val });
  });
  item.querySelector('.give-cancel-btn').addEventListener('click', () => renderGive(true));
  item.querySelector('.give-textarea').focus();
}

// ---- COMMENTS ----

const REACTIONS = [
  { type: 'talk',   emoji: '👋', label: '話したい' },
  { type: 'thanks', emoji: '❤️', label: 'ありがとう' },
  { type: 'spark',  emoji: '🐣', label: '何か生まれそう' },
  { type: 'again',  emoji: '💬', label: 'また話そう' },
];

let commentsTargetId = null;
let commentsTargetName = '';
let commentsCanPost = false;

async function loadSection(targetId, targetName, canPost) {
  commentsTargetId = targetId;
  commentsTargetName = targetName || '';
  commentsCanPost = canPost;
  const area = document.getElementById('comments-area');
  area.innerHTML = '<div class="comment-empty">読み込み中...</div>';
  try {
    const res = await gasGet({ action: 'get_comments', target_id: targetId });
    renderSection((res.ok && res.data) ? res.data : []);
  } catch (_) {
    area.innerHTML = '<div class="comment-empty">読み込めませんでした。</div>';
  }
}

function stampTag(type) {
  const r = REACTIONS.find(r => r.type === type);
  return r ? `<div class="stamp-tag">${r.emoji} ${r.label}</div>` : '';
}

function renderSection(comments) {
  const area = document.getElementById('comments-area');

  const listHtml = comments.length
    ? `<div class="comment-list">${comments.map(c => {
        const d = c.created_at ? new Date(c.created_at) : null;
        const dateStr = d && !isNaN(d)
          ? `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`
          : '';
        return `<div class="comment-item">
          ${c.reaction_type ? stampTag(c.reaction_type) : ''}
          <div class="comment-meta">
            <span class="comment-name">${escapeHtml(c.commenter_name || '匿名')}</span>
            ${dateStr ? `<span class="comment-date">${dateStr}</span>` : ''}
          </div>
          ${c.message ? `<div class="comment-text">${escapeHtml(c.message)}</div>` : ''}
        </div>`;
      }).join('')}</div>`
    : `<div class="comment-empty">${commentsCanPost ? '一番乗り！最初のメッセージを送りましょう！' : 'まだコメントはありません。'}</div>`;

  const stampOptions = REACTIONS.map(r =>
    `<option value="${r.type}">${r.emoji} ${r.label}</option>`
  ).join('');

  const formHtml = commentsCanPost ? `
    <div class="comment-form">
      <select class="stamp-select" id="comment-stamp">
        <option value="">スタンプを選んでね</option>
        ${stampOptions}
      </select>
      <input class="comment-input" id="comment-name" type="text" placeholder="名前（任意）" maxlength="50">
      <textarea class="comment-textarea" id="comment-text" placeholder="${commentsTargetName}さんへのメッセージ（任意）" maxlength="500"></textarea>
      <button class="comment-submit-btn" id="comment-submit">送る</button>
    </div>` : '';

  area.innerHTML = listHtml + formHtml;

  if (commentsCanPost) {
    document.getElementById('comment-submit')?.addEventListener('click', submitComment);
  }
}

async function submitComment() {
  const stampEl = document.getElementById('comment-stamp');
  const nameEl  = document.getElementById('comment-name');
  const textEl  = document.getElementById('comment-text');
  const btn     = document.getElementById('comment-submit');

  if (!stampEl.value) { showToast('スタンプを選んでください'); stampEl.focus(); return; }

  btn.disabled = true;
  btn.textContent = '送信中...';

  try {
    const res = await gasPost({
      action: 'post_comment',
      target_edit_id: commentsTargetId,
      reaction_type: stampEl.value,
      commenter_name: nameEl.value.trim(),
      message: textEl.value.trim(),
    });
    if (res.ok) {
      showToast('送りました！');
      await loadSection(commentsTargetId, commentsTargetName, commentsCanPost);
    } else {
      showToast('送信に失敗しました。再度お試しください。');
      btn.disabled = false;
      btn.textContent = '送る';
    }
  } catch (_) {
    showToast('通信エラーが発生しました。');
    btn.disabled = false;
    btn.textContent = '送る';
  }
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ---- GAS保存 ----

async function saveProfile(fields) {
  try {
    const res = await gasPost({ edit_id: currentEditId, ...fields });
    showToast(res.ok ? '保存しました' : '保存に失敗しました。再度お試しください。');
  } catch (_) {
    showToast('通信エラーが発生しました。');
  }
}

function showToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0d1a6b;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:9999;white-space:nowrap;';
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

// ---- データ読み込み ----

async function load() {
  const rawId = getParam('id');
  if (!rawId) { location.href = 'members.html'; return; }

  const EDIT_SUFFIX = '-edit';
  let profileId, isOwn;
  if (rawId.endsWith(EDIT_SUFFIX)) {
    profileId = rawId.slice(0, -EDIT_SUFFIX.length);
    isOwn = true;
  } else {
    profileId = rawId;
    isOwn = false;
  }

  const res = await gasGet({ action: 'participants' });
  if (!res.ok || !res.data) return;

  const p = res.data.find(x => x.edit_id === profileId);
  if (!p) { location.href = 'members.html'; return; }

  document.title = `${p.nickname || p.name} | ENJIN 2026 GUIDE BOOK`;

  // アバター
  const av = document.getElementById('avatar');
  if (p.photo_url) {
    av.innerHTML = `<img src="${convertDriveUrl(p.photo_url)}" alt="${p.nickname || p.name}">`;
  } else {
    av.textContent = initials(p.nickname || p.name);
  }

  // ヘッダー
  document.getElementById('nickname').textContent = p.nickname || p.name || '—';
  document.getElementById('realname').textContent = p.name || '';
  document.getElementById('org').textContent = [p.organization, p.title].filter(Boolean).join(' / ');

  // Facebook アイコン
  const fbIcon = document.getElementById('fb-icon');
  const fbUrl = (p.facebook_url || '').trim();
  if (fbUrl) {
    fbIcon.href = fbUrl;
    fbIcon.style.display = 'block';
  }

  // BASIC INFO
  document.getElementById('hometown').textContent = p.hometown || '—';
  document.getElementById('enjin-count').textContent = formatEnjinCount(p.enjin_count);
  document.getElementById('initiative').textContent = p.initiative || '—';

  // state を GAS データで初期化
  state.message   = p.message    || '';
  state.enjinType = p.enjin_type || '';
  state.canGive   = p.can_give   || '';
  state.needHelp  = p.need_help  || '';
  currentEditId   = p.edit_id;

  // -edit URLなら編集モード
  if (isOwn) {
    document.getElementById('permission-divider').style.display = '';
  }

  renderMessage(isOwn);
  renderType(isOwn, !!p.enjin_type);
  renderGive(isOwn);
  loadSection(profileId, p.nickname || p.name, !isOwn);

  // 自分の編集URLではないアクセスのみ計測（fire-and-forget）
  if (!isOwn) {
    gasGet({ action: 'track_view', id: profileId }).catch(() => {});
  }
}

load();
</script>
