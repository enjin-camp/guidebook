<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ENJIN 2026 GUIDE BOOK</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@700;800&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans JP',sans-serif;background:#0d1a6b;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.box{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:48px 40px;text-align:center;max-width:380px;width:100%;margin:24px;}
.logo{font-family:'Nunito Sans',sans-serif;font-size:22px;font-weight:800;letter-spacing:0.15em;color:#fff;margin-bottom:6px;}
.logo span{color:#0fb8a0;}
.sub{font-size:12px;letter-spacing:0.2em;color:rgba(255,255,255,0.45);margin-bottom:40px;}
label{font-size:12px;color:rgba(255,255,255,0.6);margin-bottom:10px;display:block;text-align:left;}
input{width:100%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:10px;padding:14px 16px;font-size:15px;color:#fff;letter-spacing:0.1em;outline:none;margin-bottom:16px;}
input:focus{border-color:rgba(15,184,160,0.6);}
button{width:100%;background:#0fb8a0;border:none;border-radius:10px;padding:14px;font-size:14px;font-weight:700;color:#fff;letter-spacing:0.08em;cursor:pointer;transition:opacity 0.2s;font-family:'Noto Sans JP',sans-serif;}
button:hover{opacity:0.85;}
button:disabled{opacity:0.5;cursor:default;}
.err{font-size:12px;color:#f87171;margin-top:10px;min-height:18px;}
</style>
</head>
<body>
<div class="box">
  <div class="logo">ENJIN 2026<br><span>GUIDE BOOK</span></div>
  <label>参加者専用パスワード</label>
  <input type="password" id="pw" placeholder="パスワードを入力" autocomplete="current-password">
  <button id="btn">入場する</button>
  <div class="err" id="err"></div>
</div>
<script src="guidebook.js"></script>
<script>
  const nextPage = new URLSearchParams(location.search).get('next') || 'home.html';
  if (isAuthed()) location.href = nextPage;

  async function tryLogin() {
    const pw = document.getElementById('pw').value.trim();
    if (!pw) return;
    const btn = document.getElementById('btn');
    btn.textContent = '確認中...';
    btn.disabled = true;
    const res = await gasGet({ action: 'auth', password: pw });
    if (res.ok) {
      setAuthed();
      location.href = nextPage;
    } else {
      document.getElementById('err').textContent = 'パスワードが正しくありません';
      btn.textContent = '入場する';
      btn.disabled = false;
    }
  }

  document.getElementById('btn').addEventListener('click', tryLogin);
  document.getElementById('pw').addEventListener('keydown', e => {
    if (e.key === 'Enter') tryLogin();
  });
</script>
</body>
</html>
